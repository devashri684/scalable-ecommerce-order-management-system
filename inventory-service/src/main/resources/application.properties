spring.application.name=inventory-service
server.port=8083

# Database Connection (matches your Docker Compose: port 3307 & password devashri)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/inventory_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=devashri

# Hibernate & Flyway
spring.jpa.hibernate.ddl-auto=none


# Swagger UI custom path
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI JSON description endpoint
springdoc.api-docs.path=/api-docs

# Enable or disable OpenAPI spec generation
springdoc.api-docs.enabled=true